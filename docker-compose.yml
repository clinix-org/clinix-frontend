# Clinix Saúde — Frontend
#
#   Docker:       docker compose up -d --build   (http://localhost:8091)
#   Programar:    npm run dev                    (http://localhost:5173)
#
# O backend deve subir primeiro, pois cria a rede compartilhada.
name: clinix-saude-frontend

services:
  frontend:
    container_name: clinix-saude-frontend
    image: clinix-saude-frontend
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_APP_ENV: production
        VITE_API_URL: ${PRODUCTION_API_URL:-/api}
    ports:
      - "${FRONTEND_PROD_BIND:-127.0.0.1}:${FRONTEND_PROD_PORT:-8091}:8080"
    networks:
      - clinix-saude
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  # Criada pelo Compose do clinix-backend, que deve subir primeiro.
  clinix-saude:
    name: clinix-saude-network
    external: true
