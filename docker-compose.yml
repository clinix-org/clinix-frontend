services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: clinix-frontend:dev
    container_name: clinix-frontend
    ports:
      - "127.0.0.1:80:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      VITE_USE_POLLING: "true"
    restart: always
